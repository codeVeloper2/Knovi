<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PeerUp logo">
  <defs>
    <linearGradient id="peerupGrad" x1="150" y1="70" x2="360" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f9bff"/>
      <stop offset="0.5" stop-color="#1fbaf0"/>
      <stop offset="1" stop-color="#25e7c6"/>
    </linearGradient>
  </defs>

  <!-- Right vertical bar + U-curve + up the left bar (open stroke) -->
  <path d="M356 96
           V300
           A100 100 0 0 1 156 300
           V300"
        stroke="url(#peerupGrad)" stroke-width="64" stroke-linecap="round" fill="none"/>

  <!-- Left bar going up to meet the arrowhead -->
  <path d="M156 300 V150"
        stroke="url(#peerupGrad)" stroke-width="64" stroke-linecap="round" fill="none"/>

  <!-- Upward arrowhead on the left bar -->
  <path d="M156 70 L226 168 H86 Z" fill="url(#peerupGrad)"/>
</svg>
