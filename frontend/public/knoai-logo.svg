<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="KnoAI">
  <defs>
    <linearGradient id="kaCrescent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="40%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="kaStar" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="45%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="kaGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer soft ring -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="#1e3a8a" stroke-width="2" opacity="0.35"/>
  <!-- Crescent (full disc minus offset disc via mask) -->
  <mask id="kaMoonMask">
    <rect width="128" height="128" fill="black"/>
    <circle cx="64" cy="64" r="46" fill="white"/>
    <circle cx="78" cy="54" r="34" fill="black"/>
  </mask>
  <circle cx="64" cy="64" r="46" fill="url(#kaCrescent)" mask="url(#kaMoonMask)" filter="url(#kaGlow)"/>
  <!-- 4-point star -->
  <path fill="url(#kaStar)" filter="url(#kaGlow)" d="
    M64 34
    C66 48 70 54 80 58
    C70 62 66 68 64 82
    C62 68 58 62 48 58
    C58 54 62 48 64 34
    Z"/>
  <!-- small side points -->
  <path fill="#93c5fd" opacity="0.9" d="M64 44 C65 50 67 52 72 54 C67 56 65 58 64 64 C63 58 61 56 56 54 C61 52 63 50 64 44 Z"/>
</svg>
